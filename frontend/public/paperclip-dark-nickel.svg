<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 180" width="72" height="180" fill="none">
  <defs>
    <!-- Deep atmospheric shadow for dark desk / night desk -->
    <filter id="clip-shadow-dark" x="-30%" y="-20%" width="160%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Gunmetal / Dark oxidized steel cylindrical metallic gradient -->
    <linearGradient id="gunmetal-grad" x1="0%" y1="0%" x2="100%" y2="0%" gradientTransform="rotate(25)">
      <stop offset="0%" stop-color="#1E232A" />
      <stop offset="20%" stop-color="#3A4454" />
      <stop offset="42%" stop-color="#7B8B9E" />
      <stop offset="58%" stop-color="#DCE3EB" />
      <stop offset="70%" stop-color="#5C6B7D" />
      <stop offset="88%" stop-color="#2D3540" />
      <stop offset="100%" stop-color="#14181D" />
    </linearGradient>

    <!-- Cool specular highlight hairline -->
    <linearGradient id="specular-cool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <g filter="url(#clip-shadow-dark)">
    <!-- Base dark outline -->
    <path
      d="M 52 142
         L 52 46
         A 20 20 0 0 0 12 46
         L 12 134
         A 24 24 0 0 0 60 134
         L 60 28
         A 18 18 0 0 0 24 28
         L 24 116
         A 12 12 0 0 0 48 116
         L 48 64"
      stroke="#0B0E12"
      stroke-width="5.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Main gunmetal wire body -->
    <path
      d="M 52 142
         L 52 46
         A 20 20 0 0 0 12 46
         L 12 134
         A 24 24 0 0 0 60 134
         L 60 28
         A 18 18 0 0 0 24 28
         L 24 116
         A 12 12 0 0 0 48 116
         L 48 64"
      stroke="url(#gunmetal-grad)"
      stroke-width="4.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Sharp specular highlight hairline -->
    <path
      d="M 51.2 141
         L 51.2 46
         A 19.2 19.2 0 0 0 12.8 46
         L 12.8 134
         A 23.2 23.2 0 0 0 59.2 134
         L 59.2 28
         A 17.2 17.2 0 0 0 24.8 28
         L 24.8 116
         A 11.2 11.2 0 0 0 47.2 116
         L 47.2 64"
      stroke="url(#specular-cool)"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />

    <!-- Cut wire end bevels -->
    <circle cx="52" cy="142" r="2.3" fill="#94A3B8" stroke="#1E232A" stroke-width="0.8" />
    <circle cx="48" cy="64" r="2.3" fill="#94A3B8" stroke="#1E232A" stroke-width="0.8" />
  </g>
</svg>
