<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 180" width="72" height="180" fill="none">
  <defs>
    <!-- Realistic drop shadow onto paper -->
    <filter id="clip-shadow" x="-30%" y="-20%" width="160%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#15120e" flood-opacity="0.28" />
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#15120e" flood-opacity="0.2" />
    </filter>

    <!-- Metallic cylindrical gradient for brass wire -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="0%" gradientTransform="rotate(25)">
      <stop offset="0%" stop-color="#7A5210" />
      <stop offset="18%" stop-color="#C89736" />
      <stop offset="42%" stop-color="#FCEAB3" />
      <stop offset="58%" stop-color="#FFFDF5" />
      <stop offset="72%" stop-color="#D9A842" />
      <stop offset="88%" stop-color="#9E6D18" />
      <stop offset="100%" stop-color="#644208" />
    </linearGradient>

    <!-- Chrome / Steel metallic gradient -->
    <linearGradient id="steel-grad" x1="0%" y1="0%" x2="100%" y2="0%" gradientTransform="rotate(25)">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="20%" stop-color="#94A3B8" />
      <stop offset="45%" stop-color="#F1F5F9" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="90%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Specular highlight overlay -->
    <linearGradient id="specular-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Group with shadow -->
  <g filter="url(#clip-shadow)">
    <!-- Base dark bevel/outline -->
    <path
      d="M 52 142
         L 52 46
         A 20 20 0 0 0 12 46
         L 12 134
         A 24 24 0 0 0 60 134
         L 60 28
         A 18 18 0 0 0 24 28
         L 24 116
         A 12 12 0 0 0 48 116
         L 48 64"
      stroke="#4A3105"
      stroke-width="5.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Main metallic brass body -->
    <path
      d="M 52 142
         L 52 46
         A 20 20 0 0 0 12 46
         L 12 134
         A 24 24 0 0 0 60 134
         L 60 28
         A 18 18 0 0 0 24 28
         L 24 116
         A 12 12 0 0 0 48 116
         L 48 64"
      stroke="url(#brass-grad)"
      stroke-width="4.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Specular light inner hairline -->
    <path
      d="M 51.2 141
         L 51.2 46
         A 19.2 19.2 0 0 0 12.8 46
         L 12.8 134
         A 23.2 23.2 0 0 0 59.2 134
         L 59.2 28
         A 17.2 17.2 0 0 0 24.8 28
         L 24.8 116
         A 11.2 11.2 0 0 0 47.2 116
         L 47.2 64"
      stroke="url(#specular-light)"
      stroke-width="1.3"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Wire cut ends 3D caps -->
    <circle cx="52" cy="142" r="2.3" fill="#FFEBB3" stroke="#5B3E06" stroke-width="0.8" />
    <circle cx="48" cy="64" r="2.3" fill="#FFEBB3" stroke="#5B3E06" stroke-width="0.8" />
  </g>
</svg>
