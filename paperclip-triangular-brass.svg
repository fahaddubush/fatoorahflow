<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 140" width="90" height="140" fill="none">
  <defs>
    <filter id="geo-shadow" x="-30%" y="-20%" width="160%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#15120e" flood-opacity="0.32" />
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#15120e" flood-opacity="0.22" />
    </filter>

    <linearGradient id="brass-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#805612" />
      <stop offset="22%" stop-color="#CFA343" />
      <stop offset="45%" stop-color="#FDF0C2" />
      <stop offset="58%" stop-color="#FFFFFE" />
      <stop offset="75%" stop-color="#DDAF48" />
      <stop offset="90%" stop-color="#9C6B1B" />
      <stop offset="100%" stop-color="#5E3B06" />
    </linearGradient>

    <linearGradient id="specular-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FCEAB3" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <g filter="url(#geo-shadow)">
    <!-- Base dark bevel/outline -->
    <path
      d="M 45 16
         L 76 102
         A 8 8 0 0 1 68 114
         L 22 114
         A 8 8 0 0 1 14 102
         L 45 36
         L 62 88
         A 6 6 0 0 1 56 96
         L 34 96
         A 6 6 0 0 1 28 88
         L 45 52"
      stroke="#452C04"
      stroke-width="5.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Main brass wire body -->
    <path
      d="M 45 16
         L 76 102
         A 8 8 0 0 1 68 114
         L 22 114
         A 8 8 0 0 1 14 102
         L 45 36
         L 62 88
         A 6 6 0 0 1 56 96
         L 34 96
         A 6 6 0 0 1 28 88
         L 45 52"
      stroke="url(#brass-gold-grad)"
      stroke-width="4.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Specular highlight hairline -->
    <path
      d="M 44.5 17
         L 75 101.5
         A 7.5 7.5 0 0 1 67.5 113
         L 22.5 113
         A 7.5 7.5 0 0 1 15 101.5
         L 44.5 36.5
         L 61 87.5
         A 5.5 5.5 0 0 1 55.5 95
         L 34.5 95
         A 5.5 5.5 0 0 1 29 87.5
         L 44.5 52.5"
      stroke="url(#specular-line)"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- End tips -->
    <circle cx="45" cy="16" r="2.2" fill="#FDF0C2" stroke="#452C04" stroke-width="0.8" />
    <circle cx="45" cy="52" r="2.2" fill="#FDF0C2" stroke="#452C04" stroke-width="0.8" />
  </g>
</svg>
